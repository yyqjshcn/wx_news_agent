name: omninewsflow

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: omninewsflow-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/embodied_news.db
      - WECHAT_ADAPTER_URL=http://wechat-adapter:5000
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - omninewsflow-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: omninewsflow-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INTERNAL_API_URL=http://api:8000
      - INTERNAL_WECHAT_ADAPTER_URL=http://wechat-adapter:5000
    depends_on:
      - api
    networks:
      - omninewsflow-network

  wechat-adapter:
    image: tmwgsicp/wechat-download-api:latest
    container_name: omninewsflow-wechat-adapter
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wechat_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omninewsflow-network
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - TZ=Asia/Shanghai

  nginx:
    image: nginx:alpine
    container_name: omninewsflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - api
    networks:
      - omninewsflow-network
    profiles:
      - nginx

networks:
  omninewsflow-network:
    name: omninewsflow-network
    driver: bridge

volumes:
  wechat_data:
  sqlite_data:
